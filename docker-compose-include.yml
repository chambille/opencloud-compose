include:
  - ./docker-compose.yml
  - ./yjs/yjs.yml
  #- ./external-proxy/opencloud.yml
  #- ./external-proxy/collabora.yml
  - ./weboffice/collabora.yml

networks:
  web:
    external: true

services:
  opencloud:
    networks:
      web:
    # lance manuellement la colaboration
    command: ["-c", "opencloud init || true; opencloud server & (sleep 20; opencloud collaboration server)"]

    environment:
      # Disable the built-in IDP
      OC_EXCLUDE_RUN_SERVICES: idp
      
      # External OIDC issuer
      OC_OIDC_ISSUER: 'https://${IDP_DOMAIN|keycloak.opencloud.test}${TRAEFIK_PORT_HTTPS}'
      PROXY_OIDC_ISSUER: 'https://${IDP_DOMAIN|keycloak.opencloud.test}${TRAEFIK_PORT_HTTPS}'
      
      # Web frontend client (Client ID of the web frontend client)
      WEB_OIDC_CLIENT_ID: $OC_OIDC_CLIENT_ID
      WEB_OIDC_AUTHORITY: 'https://${IDP_DOMAIN|keycloak.opencloud.test}${TRAEFIK_PORT_HTTPS}'
      WEB_OIDC_METADATA_URL: 'https://${IDP_DOMAIN|keycloak.opencloud.test}${TRAEFIK_PORT_HTTPS}/.well-known/openid-configuration'
      WEB_OIDC_RESPONSE_TYPE: code
      WEB_OIDC_SCOPE: openid profile email groups
      
      # Proxy OIDC settings
      PROXY_OIDC_CLIENT_ID: $OC_OIDC_CLIENT_ID
      PROXY_OIDC_REWRITE_WELLKNOWN: true
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none
      
      # User auto-provisioning
      PROXY_AUTOPROVISION_ACCOUNTS: true
      PROXY_AUTOPROVISION_CLAIM_USERNAME: preferred_username
      PROXY_AUTOPROVISION_CLAIM_EMAIL: email
      PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: name
      PROXY_AUTOPROVISION_CLAIM_GROUPS: groups
      
      # User identity mapping
      PROXY_USER_OIDC_CLAIM: preferred_username
      PROXY_USER_CS3_CLAIM: username
      
      # Role assignment — reads the opencloud_role custom claim set on Pocket ID groups
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: opencloud_role
      
      # Graph
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: false
      GRAPH_USERNAME_MATCH: none
    
    volumes:
      #- ./config/opencloud/csp.yaml:/etc/opencloud/csp.yaml
      #- ./config/opencloud/banned-password-list.txt:/etc/opencloud/banned-password-list.txt
      # configure the .env file to use own paths instead of docker internal volumes
      - /apps/opencloud2/oc-config:/etc/opencloud
      - /apps/opencloud2/oc-data:/var/lib/opencloud
      - /apps/opencloud2/oc-config/apps:/var/lib/opencloud/web/assets/apps
      # yjs route
      - /apps/opencloud2/config/opencloud/proxy.yaml:/etc/opencloud/proxy.yaml
    labels:
      - "traefik.enable=true"
      # define middleware here, to make sure its loaded with the first defined container (opencloud)
      # if defined in the traefik container with a disabled dashboard it won't be loaded fast enough
      - "traefik.http.middlewares.hsts-header.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts-header.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts-header.headers.stsPreload=true"
      - "traefik.http.middlewares.hsts-header.headers.forceSTSHeader=true"
      - "traefik.http.routers.opencloud-rtr.entrypoints=websecure"
      - "traefik.http.routers.opencloud.rule=Host(`${OC_DOMAIN:-cloud.opencloud.test}`)"
      - "traefik.http.routers.opencloud-rtr.service=opencloud-svc"
      - "traefik.http.routers.opencloud-rtr.middlewares=chain-no-auth@file,hsts-header"
      - "traefik.http.services.opencloud-svc.loadbalancer.server.port=9200"
      #- "traefik.http.routers.opencloud.${TRAEFIK_SERVICES_TLS_CONFIG}"
      
  collabora:
    networks:
      web:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora-rtr.entrypoints=websecure"
      - "traefik.http.routers.collabora-rtr.rule=Host(`${COLLABORA_DOMAIN:-collabora.opencloud.test}`)"
     # - "traefik.http.routers.collabora-rtr.${TRAEFIK_SERVICES_TLS_CONFIG}"
      - "traefik.http.routers.collabora-rtr.service=collabora-svc"
      - "traefik.http.routers.collabora-rtr.middlewares=chain-no-auth@file,hsts-header"
      - "traefik.http.services.collabora-svc.loadbalancer.server.port=9980"
